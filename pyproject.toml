[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot-local"
version = "0.4.0"
description = "Local evidence reports for reviewing agent-assisted code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Operating System :: POSIX :: Linux", "Operating System :: MacOS"]
dependencies = []

[project.scripts]
blindspot = "blindspot.cli:main"

[tool.setuptools.packages.find]
include = ["blindspot*"]

[tool.setuptools.package-data]
"blindspot.observer" = ["web/*.html", "web/*.js", "web/*.css", "dashboard_dist/*.html", "dashboard_dist/assets/*", "dashboard_dist/fonts/*", "dashboard_dist/licenses/*"]
